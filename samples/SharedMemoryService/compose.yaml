name: mintokei-memory
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${MEMORY_POSTGRES_PASSWORD:?Set MEMORY_POSTGRES_PASSWORD}
      POSTGRES_DB: memory
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 5s
      retries: 12
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.13.5
    volumes: ["ollama-data:/root/.ollama"]
    restart: unless-stopped
  memory-service:
    build:
      context: ../..
      dockerfile: Dockerfile.memory
    environment:
      ConnectionStrings__Memory: Host=postgres;Database=memory;Username=memory;Password=${MEMORY_POSTGRES_PASSWORD}
      MemoryService__Token: ${MEMORY_SERVICE_TOKEN:?Set MEMORY_SERVICE_TOKEN}
      MemoryService__SourceSystem: mintokei
      MemoryService__OwnerId: local
      MemoryService__Namespace: live
      Memory__EmbeddingUrl: http://ollama:11434
      Memory__EmbeddingModel: nomic-embed-text
      Memory__EmbeddingDimensions: 768
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
    ports: ["127.0.0.1:5052:8080"]
    volumes: ["memory-data:/data"]
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres-data:
  ollama-data:
  memory-data:
